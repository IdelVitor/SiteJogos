services:
  mysql:
    image: mysql:8.0
    container_name: mysql-sedem
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Id14340605@
      MYSQL_DATABASE: sedemdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  mysql_data: